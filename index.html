<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <h1>Weather App</h1>
      <p class="loading" style="display: none;">Loading...</p>

      <!--SEARCH-->
      <div class="search">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name"
          autocomplete="off"
        />
        <button id="searchBtn">Search</button>
      </div>
      <!--WEATHER RESULT-->
      <section class="weather" id="weather">
        
        <!--CITY-->
        <h2 class="city">--</h2>
        
        <img class="weather-icon" src="assets/icons/unknown.png" alt="Weather icon">

        <!--TEMPERATURE-->
        <p class="temp">--°C</p>

        <!--DESCRIPTION-->
        <p class="description">Enter a city to see the weather</p>

        <!--EXTRA INFO-->
        <div class="details">
          <p>Humidity: <span class="humidity">--</span>%</p>
          <p>Wind: <span class="wind">--</span> km/h</p>
        </div>
        <p class="loading" style="display: none;">Loading...</p>
      </section>
    </main>

    <!--JAVASCRIPT-->
    <script src="script.js"></script>
  </body>
</html>
