<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <h1>Weather App</h1>
      <p class="loading" style="display: none;">Loading...</p>

      <!--SEARCH-->
      <div class="search">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name"
          autocomplete="off"
        />
        <button id="searchBtn">Search</button>
      </div>
      <!--WEATHER RESULT-->
      <section class="weather" id="weather">
        
        <!--CITY-->
        <h2 class="city">--</h2>
        
        <img class="weather-icon" src="assets/icons/unknown.png" alt="Weather icon">

        <!--TEMPERATURE-->
        <p class="temp">--°C</p>
        <div class="unit-toggle">
          <button id="celsiusBtn" class="active">°C</button>
          <button id="fahrenheitBtn">°F</button>
        </div>

        <!--DESCRIPTION-->
        <p class="description">Enter a city to see the weather</p>

        <!--EXTRA INFO-->
       <div class="details">
          <div>
            Feels like: <span class="feels-like">--</span>°
          </div>
          <div>
            Humidity: <span class="humidity">--</span>%
          </div>
          <div>
            Wind: <span class="wind">--</span> km/h
          </div>
        </div>

<p class="loading" style="display: none;"></p>

    <!--JAVASCRIPT-->
    <script src="script.js"></script>
  </body>
</html>
